name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing, and these jobs build a whole Tauri app.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info is the bulk of the build output and nothing here reads a backtrace
  # symbol table.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust:
    # macOS because that is the platform Tervin is tested on, and because the PTY
    # tests drive the real vim and less that ship with it. Running them on Linux
    # would be testing a different terminal.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        # Warnings are failures here. A warning nobody fixes is a warning everybody
        # learns to scroll past.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        # The suite drives real PTYs, real subprocesses, and real sockets, so it is
        # slower than a unit-test suite and worth the wall-clock.
        run: cargo test --workspace

      - name: Confirm the terminal tests actually ran
        # These skip when their binary is missing. A silent skip would let a
        # regression in the most important tests pass unnoticed.
        run: |
          for tool in vim less zsh; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is missing, so its tests were skipped"; exit 1; }
          done

  linux:
    # Tervin has only ever been run on macOS. The code is written for Unix generally
    # and nothing in the PTY layer is macOS-specific, but "should work" is not a
    # claim worth making, so this job exists to find out. README still says macOS is
    # the tested platform, and that does not change until a person has used Linux for
    # a day: a green CI run proves the tests pass, not that the product is usable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System dependencies
        # Tauri links against the system webview, so even `cargo test` needs these:
        # tervin-app is part of the workspace. `zsh` and `vim` are here because the
        # terminal tests drive them and skip silently when they are missing, which
        # would make this job green while proving very little.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf zsh vim

      - name: Confirm the tools the terminal tests need are present
        # Before the tests rather than after, so a missing tool reads as setup being
        # wrong rather than as a test failure.
        run: |
          for tool in vim less zsh; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is missing, so its tests would be skipped"; exit 1; }
          done

      - name: Tests
        run: cargo test --workspace

      - name: Clippy
        # Separate from the macOS job because `cfg` differences mean each platform
        # compiles code the other does not, so a lint can be clean on one and not the
        # other.
        run: cargo clippy --workspace --all-targets -- -D warnings

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        # The tsconfig is at the repository root and already scopes itself to ui/.
        # `-p ui` looks for a config that is not there and fails.
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm exec vite build

  bundle:
    # Proves the thing users actually install still builds. Not gated on the other
    # jobs: a bundling break is worth knowing about even when a test fails.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Bundle the app
        run: pnpm exec tauri build --bundles app
