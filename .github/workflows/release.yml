name: Release

# One tag produces everything: a GitHub release, an npm package, and an updated Homebrew
# tap. No checksum is pasted by hand — every one is computed here and injected, because a
# checksum a human copies is a checksum that eventually stops matching the artefact it
# claims to describe.
on:
  push:
    tags: ["v*"]
  # So the packaging can be exercised without cutting a tag. Publishing steps are gated
  # on `github.ref_type == 'tag'`, so a manual run builds and verifies without shipping.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball_name: ${{ steps.checksums.outputs.tarball_name }}
      tarball_sha: ${{ steps.checksums.outputs.tarball_sha }}
      dmg_sha: ${{ steps.checksums.outputs.dmg_sha }}
      # Tauri decides this name, so it is read rather than composed. The Homebrew cask
      # needs the exact published asset name, and an earlier version guessed it wrongly.
      dmg_name: ${{ steps.checksums.outputs.dmg_name }}
      signed: ${{ steps.signing.outputs.signed }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal binary, so one download works on Apple silicon and Intel.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        # The tag is the source of truth, and it must agree with the manifest. A release
        # whose artefacts disagree with its tag is worse than no release.
        run: |
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$CARGO_VERSION" ]; then
              echo "::error::tag v${VERSION} does not match the workspace version ${CARGO_VERSION}"
              exit 1
            fi
          else
            VERSION="$CARGO_VERSION"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION}"

      - name: Test before building
        # A release that was never tested is not a release.
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          pnpm exec vitest run

      - name: Decide whether to sign
        # `certcheck`, not `sign`, because the step below is `signing` and two ids that
        # differ by one letter is how the wrong one gets referenced later.
        id: certcheck
        # An absent GitHub secret interpolates to an **empty string**, not to nothing. So
        # putting these straight in a step's `env:` sets `APPLE_CERTIFICATE=""`, Tauri sees a
        # variable that is present, tries to sign, and `security import` fails on an empty
        # certificate. That is exactly what killed the v0.1.0 release: the universal binary
        # built fine and then bundling died with
        # "SecKeychainItemImport: One or more parameters passed to a function were not valid".
        #
        # Empty is not absent. This is the third time that distinction has cost this project
        # something, after `CLAUDE_CONFIG_DIR` and a profile's environment overrides, which is
        # why `runtime::apply_env` removes an empty value rather than setting it.
        #
        # So the variables are exported only when there is really a certificate. With no
        # secrets, nothing is set and Tauri does not attempt to codesign at all.
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "${CERT:-}" ]; then
            echo "signing=1" >> "$GITHUB_OUTPUT"
            echo "A signing certificate is present; the bundle will be signed."
          else
            echo "signing=0" >> "$GITHUB_OUTPUT"
            echo "No signing certificate. Building unsigned, which is the intended default:"
            echo "  macOS applies quarantine in the downloading application, so the curl"
            echo "  installer and npx open with no Gatekeeper dialog regardless."
          fi

      - name: Build (unsigned)
        if: steps.certcheck.outputs.signing != '1'
        # No Apple variables in the environment at all, which is the whole point.
        run: pnpm exec tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Build (signed)
        if: steps.certcheck.outputs.signing == '1'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Signing status
        id: signing
        run: |
          APP="target/universal-apple-darwin/release/bundle/macos/Tervin.app"
          if codesign -dv --verbose=2 "$APP" 2>&1 | grep -q "Authority=Developer ID"; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            spctl -a -vvv -t install "$APP" 2>&1 || \
              echo "::warning::signed but not notarised, so a browser download will still be warned about"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::unsigned, which is intended. A browser download of the .dmg and a Homebrew cask install hit Gatekeeper; the curl installer, npx, and the source formula do not, because macOS applies quarantine in the downloading application."
          fi

      - name: Tarball for the npm and curl routes
        # Those routes do not want a disk image — and a file fetched by curl or Node
        # carries no quarantine attribute, which is what lets an unsigned build open
        # without a Gatekeeper prompt at all.
        run: |
          V="${{ steps.version.outputs.version }}"
          BUNDLE="target/universal-apple-darwin/release/bundle"
          tar -czf "${BUNDLE}/dmg/Tervin-${V}-macos-universal.tar.gz" -C "${BUNDLE}/macos" Tervin.app

      - name: Checksums
        id: checksums
        run: |
          V="${{ steps.version.outputs.version }}"
          cd target/universal-apple-darwin/release/bundle/dmg
          shasum -a 256 *.dmg *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

          TARBALL="Tervin-${V}-macos-universal.tar.gz"
          DMG="$(ls *.dmg | head -1)"
          echo "tarball_name=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "tarball_sha=$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "dmg_sha=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "dmg_name=${DMG}" >> "$GITHUB_OUTPUT"

          # The build is universal, so exactly one DMG is expected. Two would mean the
          # bundler changed and the `head -1` above silently picked one of them.
          COUNT="$(ls *.dmg | wc -l | tr -d ' ')"
          if [ "$COUNT" != "1" ]; then
            echo "::error::expected one universal .dmg, found ${COUNT}. The cask assumes one."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: macos-bundles
          path: target/universal-apple-darwin/release/bundle/dmg/*
          retention-days: 7

      - name: GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/packaging/install.sh | sh
            ```

            Or, if you have Node:

            ```sh
            npx tervin
            ```

            **No Gatekeeper prompt on either route.** macOS applies quarantine in the
            *downloading application*, and neither `curl` nor Node sets it. The `.dmg`
            below **is** quarantined if you download it in a browser, and needs approving
            in System Settings, which is why it is the least recommended option.

            Tervin is not signed with an Apple Developer ID and will not be, so the
            checksum is the only thing vouching for a binary. The installer script and the
            npm package both verify it against `SHA256SUMS.txt` and refuse to install
            without it.

            Building from source is also unquarantined:

            ```sh
            brew tap quintinbotes/tervin https://github.com/QuintinBotes/tervin
            brew install --formula tervin
            ```

            **Signed with a Developer ID:** `${{ steps.signing.outputs.signed }}`, and for
            Tervin that is expected to say `false`. Signing is deliberately not done
            ([why](https://github.com/QuintinBotes/tervin/blob/main/SECURITY.md#why-unsigned-is-a-decision-not-a-gap)),
            so verifying the checksum is the actual check, not a formality:

            ```sh
            shasum -a 256 -c SHA256SUMS.txt
            ```

            Do **not** run `xattr -d com.apple.quarantine`. If a route you chose warns,
            use right-click then Open once, or use one of the routes above that never warns.
          files: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/dmg/*.tar.gz
            target/universal-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
            packaging/install.sh

  npm:
    # After the release, because the installer downloads from it. Publishing a package
    # that points at assets which do not exist yet gives everyone a broken `npx` for
    # however long the gap lasts.
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      # For npm trusted publishing over OIDC, which lets this job publish without a
      # long-lived token in a secret. Requested at the job level rather than the
      # workflow level so nothing else in this file can mint an identity token.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 22 rather than 20 because OIDC publishing needs Node 22.14 or newer.
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: An npm new enough to publish over OIDC
        # The npm bundled with Node 22 predates trusted publishing. Without this the
        # job silently falls back to token auth and the OIDC path is never exercised.
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version), node $(node --version)"

      - name: Fill in the manifest
        # Injected rather than committed: the checksum cannot be known before the build,
        # and a placeholder in a published package makes every install warn that the
        # download was not verified.
        env:
          V: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.tarball_sha }}
          FILE: ${{ needs.build.outputs.tarball_name }}
        run: |
          cd packaging/npm
          node -e '
            const fs = require("fs");
            const { V, SHA, FILE } = process.env;
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            manifest.version = V;
            manifest.baseUrl = `https://github.com/QuintinBotes/tervin/releases/download/v${V}/`;
            // Both architectures take the same universal build.
            for (const key of ["darwin-arm64", "darwin-x64"]) {
              manifest.artifacts[key] = { file: FILE, sha256: SHA };
            }
            fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 2) + "\n");

            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = V;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          cat manifest.json

      - name: Verify the installer against the real release
        # The check that matters: fetch the published asset, confirm the checksum, and
        # confirm the archive holds a bundle. Publishing without this ships an installer
        # nobody has run.
        run: |
          cd packaging/npm
          node -e '
            const { execFileSync } = require("child_process");
            const crypto = require("crypto");
            const fs = require("fs");
            const m = require("./manifest.json");
            const a = m.artifacts["darwin-arm64"];
            execFileSync("curl", ["-fsSL", "-o", "/tmp/t.tar.gz", m.baseUrl + a.file], {
              stdio: "inherit",
            });
            const got = crypto
              .createHash("sha256")
              .update(fs.readFileSync("/tmp/t.tar.gz"))
              .digest("hex");
            if (got !== a.sha256) throw new Error(`checksum mismatch: ${got} vs ${a.sha256}`);
            const list = execFileSync("tar", ["-tzf", "/tmp/t.tar.gz"], { encoding: "utf8" });
            if (!list.includes("Tervin.app/")) throw new Error("no Tervin.app in the archive");
            console.log("release asset verified");
          '

      - name: Which credential is available
        # Two ways to authenticate, and this reports which one will be used before the
        # attempt rather than leaving a 403 to be decoded afterwards.
        #
        # A secret cannot be read back, so an empty `NPM_TOKEN` is indistinguishable
        # from an unset one until it is used. Same class of problem as the Apple
        # signing variables above: empty is not absent.
        id: cred
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            if WHO="$(npm whoami 2>&1)"; then
              echo "token present and accepted, as ${WHO}"
              echo "token=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::NPM_TOKEN was rejected by the registry: ${WHO}"
              echo "token=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "no NPM_TOKEN; relying on trusted publishing over OIDC"
            echo "token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          # Passed when present. With npm 11.5.1 or newer and `id-token: write`, npm
          # attempts OIDC first and uses this only as a fallback, so having both is
          # safe rather than ambiguous.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packaging/npm
          # Redirect and then print, rather than piping into `tee`. A pipeline's exit
          # status is the *last* command's, so `npm publish | tee` reports tee's
          # success and a 403 reads as a clean publish. That is worse than the bug it
          # was added to diagnose, and a simulated 403 caught it here.
          set +e
          npm publish --access public > /tmp/publish.log 2>&1
          status=$?
          set -e
          cat /tmp/publish.log
          if [ "$status" -eq 0 ]; then
            echo "published"
            exit 0
          fi
          # A 403 here has exactly two causes and they need different fixes, so the
          # log says which rather than leaving the npm error to be interpreted. This
          # is the failure that broke the first v0.1.0 attempt.
          if grep -q "bypass 2fa" /tmp/publish.log; then
            cat <<'EOF'
          ::error::npm refused the publish because the account requires 2FA for writes.

          Two ways to fix it, in order of preference:

          1. Trusted publishing, which removes the secret entirely. On npmjs.com open
             the tervin package settings, add a GitHub Actions trusted publisher with
             repository QuintinBotes/tervin and workflow file release.yml, then delete
             the NPM_TOKEN secret. This job already requests `id-token: write`.
             Note: the package must exist before it can be configured, so the very
             first publish has to happen another way.

          2. A granular access token with "Bypass 2FA" enabled, which is off by
             default at creation and cannot be added afterwards, so a new token is
             needed. Give it Read and write on the tervin package, then
             `gh secret set NPM_TOKEN --repo QuintinBotes/tervin`.
          EOF
            exit 1
          fi
          echo "::error::npm publish failed; see the log above"
          exit 1

  homebrew:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check the deploy key is present
        # Checked first, so a missing key is one clear line rather than a git
        # authentication failure forty lines into a shell script.
        env:
          KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::TAP_DEPLOY_KEY is empty or unset, so the Homebrew tap was not updated. The GitHub release and npm package are unaffected."
            echo "  ssh-keygen -t ed25519 -N '' -C tervin-release-tap -f /tmp/tap_key"
            echo "  gh repo deploy-key add /tmp/tap_key.pub --repo ${{ github.repository }} --allow-write"
            echo "  gh secret set TAP_DEPLOY_KEY --repo ${{ github.repository }} < /tmp/tap_key"
            echo "skip=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v7
        if: env.skip != '1'
        with:
          # A real branch: the tag checkout is detached, and this job commits.
          ref: ${{ github.event.repository.default_branch }}
          # Pushed with a deploy key rather than the job's own token.
          #
          # The default branch is guarded by a ruleset and `GITHUB_TOKEN` cannot get
          # through it: the GitHub Actions app can only be a ruleset bypass actor on an
          # organisation-owned repository, and a pull request opened with that token does
          # not trigger CI — so the required checks would never report and it would wait
          # forever.
          #
          # A deploy key is the narrowest thing that works. It is scoped to this one
          # repository, carries no user identity, and cannot reach anything else in the
          # account the way a personal access token could.
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Source tarball checksum
        if: env.skip != '1'
        id: source
        # GitHub generates this archive for the tag, and the formula builds from it — so
        # its checksum has to be read rather than assumed.
        run: |
          V="${{ needs.build.outputs.version }}"
          curl -fsSL -o /tmp/src.tar.gz \
            "https://github.com/${{ github.repository }}/archive/refs/tags/v${V}.tar.gz"
          echo "sha=$(sha256sum /tmp/src.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update the tap
        if: env.skip != '1'
        env:
          V: ${{ needs.build.outputs.version }}
          DMG_SHA: ${{ needs.build.outputs.dmg_sha }}
          DMG_NAME: ${{ needs.build.outputs.dmg_name }}
          SRC_SHA: ${{ steps.source.outputs.sha }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p Casks Formula

          # Generated rather than edited in place, so the templates stay the one place
          # the packaging is reviewed and a second release does not have to match
          # substitutions it made on the first.
          {
            echo "# Generated by .github/workflows/release.yml for v${V}. Do not edit:"
            echo "# change packaging/homebrew/tervin.rb, which this is built from."
            sed -e "s|^  version \".*\"|  version \"${V}\"|" \
                -e "s|REPLACE_WITH_DMG_SHA256|${DMG_SHA}|" \
                -e "s|REPLACE_WITH_DMG_NAME|${DMG_NAME}|" \
                packaging/homebrew/tervin.rb
          } > Casks/tervin.rb

          {
            echo "# Generated by .github/workflows/release.yml for v${V}. Do not edit:"
            echo "# change packaging/homebrew/tervin-formula.rb, which this is built from."
            sed -e "s|v[0-9][0-9.]*\.tar\.gz|v${V}.tar.gz|" \
                -e "s|REPLACE_WITH_SOURCE_TARBALL_SHA256|${SRC_SHA}|" \
                packaging/homebrew/tervin-formula.rb
          } > Formula/tervin.rb

          # A tap that installs nothing is worse than a tap that was not updated,
          # because the run reports success either way. So every substitution is
          # checked rather than assumed.
          if grep -q "REPLACE_WITH" Casks/tervin.rb Formula/tervin.rb; then
            echo "::error::a placeholder survived substitution"
            exit 1
          fi
          if ! grep -q "version \"${V}\"" Casks/tervin.rb; then
            echo "::error::the cask does not carry version ${V}"
            exit 1
          fi
          if ! grep -q "${DMG_NAME}" Casks/tervin.rb; then
            echo "::error::the cask does not reference the published asset ${DMG_NAME}"
            exit 1
          fi
          ruby -c Casks/tervin.rb
          ruby -c Formula/tervin.rb

          git config user.name "tervin-release"
          git config user.email "release@tervin.dev"
          git add Casks/tervin.rb Formula/tervin.rb
          if git diff --cached --quiet; then
            echo "tap already current for ${V}"
            exit 0
          fi
          # Separate -m flags: an embedded newline would carry this file's YAML
          # indentation into the commit message body.
          git commit \
            -m "tervin ${V}: update the Homebrew cask and formula" \
            -m "Checksums come from the assets this run published." \
            -m "[skip ci]"

          # Anything that lands on the default branch while this job runs must not
          # cause a lost update or tempt a force push.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "tap updated to ${V}"
              exit 0
            fi
            echo "push rejected; rebasing onto ${BRANCH} (attempt ${attempt})"
            git pull --rebase origin "${BRANCH}"
          done
          echo "::error::could not update the tap after three attempts."
          echo "  If the branch is protected, its ruleset needs a DeployKey bypass actor"
          echo "  and this key needs write access:"
          echo "    gh repo deploy-key list --repo ${{ github.repository }}"
          exit 1
