[package]
name = "tervin-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tervin desktop host: wires the terminal, blocks, git, rules, and agent runtimes to the workspace UI."
default-run = "tervin"

[lib]
name = "tervin_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "tervin"
path = "src/main.rs"

[dependencies]
tervin-core.workspace = true
terminal-core.workspace = true
shell-integration.workspace = true
block-engine.workspace = true
git-service.workspace = true
session-manager.workspace = true
file-index.workspace = true
agent-runtime.workspace = true
rules-engine.workspace = true

serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
parking_lot.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
async-trait.workspace = true
dirs = "6.0.0"

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["codegen"] }

[dev-dependencies]
# Real transcript files on disk: the reader follows a file the agent is writing,
# which is not something an in-memory fixture can reproduce.
tempfile = "3.27.0"
# The shell hook base64-encodes the command; a Block test has to do the same.
base64.workspace = true
