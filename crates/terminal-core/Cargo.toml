[package]
name = "terminal-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PTY sessions, OSC escape-sequence tap, and shell-integration signal extraction."

[dependencies]
tervin-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
tracing.workspace = true
base64.workspace = true
chrono.workspace = true
portable-pty = "0.9.0"

# For `tcgetattr`, which is the only way to ask whether the child has taken the
# terminal out of canonical mode. That is the moment input stops being discarded.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "osc_scan"
harness = false
